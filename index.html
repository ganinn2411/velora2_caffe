<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>POS Sistemi</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      padding-bottom: 70px; /* Alt navigasyon alanı için */
    }

    /* Üst Alan & Arama */
    .header-container {
      padding: 12px 16px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .search-box {
      position: relative;
      flex-grow: 1;
      margin-right: 12px;
    }

    .search-box input {
      width: 100%;
      background-color: #1c1c1e;
      border: 1px solid #2c2c2e;
      border-radius: 8px;
      padding: 8px 12px 8px 36px;
      color: #fff;
      font-size: 14px;
      outline: none;
    }

    .search-icon {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: #8e8e93;
      font-size: 14px;
    }

    .status-badge {
      display: flex;
      align-items: center;
      font-size: 13px;
      color: #d1d1d6;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background-color: #34c759;
      border-radius: 50%;
      margin-right: 6px;
    }

    /* Kategori Butonları */
    .categories {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 8px;
      scrollbar-width: none;
    }

    .categories::-webkit-scrollbar {
      display: none;
    }

    .category-btn {
      background-color: #1c1c1e;
      color: #ffffff;
      border: 1px solid #3a3a3c;
      padding: 6px 14px;
      border-radius: 16px;
      font-size: 13px;
      white-space: nowrap;
      cursor: pointer;
    }

    .category-btn.active {
      background-color: #ffffff;
      color: #000000;
      border-color: #ffffff;
    }

    /* Ürün Izgarası (Grid) */
    .product-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      padding: 0 16px 16px 16px;
    }

    .product-card {
      background-color: #1c1c1e;
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 75px;
      border: 1px solid #2c2c2e;
      cursor: pointer;
    }

    .product-name {
      font-size: 13px;
      font-weight: 500;
      color: #ffffff;
      margin-bottom: 6px;
    }

    .product-price {
      font-size: 13px;
      font-weight: 600;
      color: #d4a373; /* Şık bir fiyat vurgu rengi */
    }

    /* Mevcut Sipariş Alanı */
    .order-section {
      border-top: 1px solid #2c2c2e;
      padding: 16px;
    }

    .order-header {
      margin-bottom: 12px;
    }

    .order-title {
      font-size: 16px;
      font-weight: 600;
    }

    .order-id {
      font-size: 13px;
      color: #8e8e93;
    }

    /* Sipariş Kalemi (Item) */
    .order-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: #1c1c1e;
      padding: 10px 14px;
      border-radius: 8px;
      margin-bottom: 8px;
    }

    .order-item-info {
      display: flex;
      flex-direction: column;
    }

    .order-item-name {
      font-size: 14px;
      font-weight: 500;
    }

    .order-item-price {
      font-size: 12px;
      color: #8e8e93;
    }

    .quantity-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .qty-btn {
      width: 28px;
      height: 28px;
      background-color: #2c2c2e;
      border: 1px solid #3a3a3c;
      color: #fff;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      cursor: pointer;
    }

    .qty-number {
      font-size: 14px;
      font-weight: 600;
      min-width: 16px;
      text-align: center;
    }

    /* Alt Navigasyon */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 60px;
      background-color: #121212;
      border-top: 1px solid #2c2c2e;
      display: flex;
      justify-content: space-around;
      align-items: center;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #8e8e93;
      text-decoration: none;
      font-size: 11px;
      gap: 3px;
    }

    .nav-item.active {
      color: #d4a373;
    }

    .nav-icon {
      font-size: 18px;
    }
  </style>
</head>
<body>

  <!-- Üst Alan -->
  <div class="header-container">
    <div class="top-bar">
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" placeholder="Ürün ara...">
      </div>
      <div class="status-badge">
        <span class="status-dot"></span>
        <span>Çevrimiçi 12:00</span>
      </div>
    </div>

    <!-- Filtreler / Kategoriler -->
    <div class="categories">
      <button class="category-btn active">Tümü</button>
      <button class="category-btn">Sıcak Kahveler</button>
      <button class="category-btn">Soğuk Kahveler</button>
      <button class="category-btn">Tatlılar</button>
    </div>
  </div>

  <!-- Ürün Izgarası -->
  <div class="product-grid">
    <div class="product-card">
      <div class="product-name">Espresso</div>
      <div class="product-price">₺45.00</div>
    </div>
    <div class="product-card">
      <div class="product-name">Americano</div>
      <div class="product-price">₺55.00</div>
    </div>
    <div class="product-card">
      <div class="product-name">Latte</div>
      <div class="product-price">₺65.00</div>
    </div>
    <div class="product-card">
      <div class="product-name">Cappuccino</div>
      <div class="product-price">₺65.00</div>
    </div>
    <div class="product-card">
      <div class="product-name">Iced Latte</div>
      <div class="product-price">₺70.00</div>
    </div>
    <div class="product-card">
      <div class="product-name">Cheesecake</div>
      <div class="product-price">₺90.00</div>
    </div>
  </div>

  <!-- Mevcut Sipariş Bölümü -->
  <div class="order-section">
    <div class="order-header">
      <div class="order-title">Mevcut Sipariş</div>
      <div class="order-id">#1024</div>
    </div>

    <!-- Sipariş Elemanı 1 -->
    <div class="order-item">
      <div class="order-item-info">
        <span class="order-item-name">Latte</span>
        <span class="order-item-price">₺65.00</span>
      </div>
      <div class="quantity-controls">
        <button class="qty-btn">-</button>
        <span class="qty-number">1</span>
        <button class="qty-btn">+</button>
      </div>
    </div>

    <!-- Sipariş Elemanı 2 -->
    <div class="order-item">
      <div class="order-item-info">
        <span class="order-item-name">Cheesecake</span>
        <span class="order-item-price">₺90.00</span>
      </div>
      <div class="quantity-controls">
        <button class="qty-btn">-</button>
        <span class="qty-number">1</span>
        <button class="qty-btn">+</button>
      </div>
    </div>
  </div>

  <!-- Alt Navigasyon Barı -->
  <div class="bottom-nav">
    <a href="#" class="nav-item active">
      <span class="nav-icon">📊</span>
      <span>POS</span>
    </a>
    <a href="#" class="nav-item">
      <span class="nav-icon">☕</span>
      <span>Barista</span>
    </a>
    <a href="#" class="nav-item">
      <span class="nav-icon">📈</span>
      <span>Raporlar</span>
    </a>
    <a href="#" class="nav-item">
      <span class="nav-icon">👤</span>
      <span>Kasiyer</span>
    </a>
  </div>

</body>
</html>
